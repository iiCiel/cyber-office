<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Cyber Office: a pixel-art game where you live a week as a junior security analyst." />
    <meta name="theme-color" content="#12121c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/cyber-office/favicon.svg" />
    <title>Cyber Office</title>
    <style>
      html, body { margin: 0; height: 100%; background: #12121c; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      /* On a small portrait screen (phone held upright), ask to rotate: the in-game screens read better wide. */
      #rotate { display: none; }
      @media (max-width: 820px) and (orientation: portrait) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 1000; background: #12121c;
          flex-direction: column; align-items: center; justify-content: center; text-align: center;
          color: #e6e6ea; font-family: system-ui, sans-serif; padding: 24px;
        }
        #game { display: none; }
      }
      #rotate .phone { font-size: 56px; animation: rot 2s ease-in-out infinite; }
      #rotate h1 { color: #3fe07a; font-size: 22px; margin: 16px 0 6px; }
      #rotate p { color: #9aa3b8; max-width: 320px; }
      @keyframes rot { 0%,40% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone">📱</div>
      <h1>Rotate your phone</h1>
      <p>Cyber Office plays best in landscape. Turn your phone sideways to start your week at Halcyon Mutual.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
